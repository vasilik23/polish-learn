[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "polskiflow"
version = "0.1.0"
description = "Python/Django implementation of PolskiFlow"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["polskiflow*"]
