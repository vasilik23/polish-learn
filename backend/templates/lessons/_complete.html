<div class="card complete-card">
  <div class="complete-icon">🎉</div>
  <p class="eyebrow">Świetna robota!</p>
  <h1>Урок завершён</h1>
  <div class="score">{{ score }} / {{ total }}</div>
  <p class="muted">{% if saved %}Результат сохранён — дневная цель стала ближе.{% else %}Урок завершён, но сейчас не удалось сохранить прогресс.{% endif %}</p>
  <a class="button" href="{% url 'home' %}">Вернуться к плану</a>
</div>
