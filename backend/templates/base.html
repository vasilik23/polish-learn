{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6d4aff">
    <title>{% block title %}PolskiFlow{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'polskiflow/app.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous" defer></script>
  </head>
  <body class="{% block body_class %}{% endblock %}" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% if request.supabase_user %}
      <nav class="app-nav" aria-label="Основная навигация">
        <a class="brand" href="{% url 'home' %}" aria-label="PolskiFlow — на главную">
          <span class="brand-mark">P</span><span class="brand-name">PolskiFlow</span>
        </a>
        <div class="nav-links">
          <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
            <span class="nav-icon" aria-hidden="true">⌂</span><span>Сегодня</span>
          </a>
          <a href="{% url 'home' %}#tasks" class="nav-link">
            <span class="nav-icon" aria-hidden="true">◇</span><span>Учиться</span>
          </a>
          <a href="{% url 'home' %}#daily-plan" class="nav-link">
            <span class="nav-icon" aria-hidden="true">↗</span><span>Прогресс</span>
          </a>
        </div>
        <form class="nav-logout" method="post" action="{% url 'logout' %}">
          {% csrf_token %}<button class="icon-button" type="submit" title="Выйти" aria-label="Выйти">↪</button>
        </form>
      </nav>
    {% endif %}
    <main class="page-shell {% if request.supabase_user %}with-nav{% endif %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
