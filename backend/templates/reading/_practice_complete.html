<section class="card complete-card">
  <div class="complete-icon">🏆</div><p class="eyebrow">Тренировка завершена</p><h1>Отличная работа!</h1><div class="score">{{ score }} / {{ total }}</div>
  <p class="muted">{% if saved %}Результат добавлен в твой дневной прогресс.{% else %}Результат не сохранился, но тренировку можно повторить.{% endif %}</p>
  <a class="button" href="{% url 'dictionary-practice' %}">Повторить</a><a class="button secondary" href="{% url 'dictionary' %}">Вернуться в словарь</a>
</section>
